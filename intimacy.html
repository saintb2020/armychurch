html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans-ja);line-height:2;font-size:16px;-webkit-font-smoothing:antialiased}

<script>
const UI = {
 ja:{home:'目次', prev:'← 前へ', next:'次へ →',
     door:'神様を一番にしたい人へ',
     doorNote:'一日の最初。収入の最初。この体。どれも、順番の話だ。',
     doorBtn:'決断のページへ',
     done:'このセクションを終えた', doneOn:'✓ 完了',
     refHead:'いつでも開ける',
     start:'序章① から始める',
     openLabel:'聖句をひらく（リビングバイブル）',
     progress:'完了'},
 en:{home:'Contents', prev:'← Previous', next:'Next →',
     door:'For anyone who wants to put God first',
     doorNote:'The first of your day. The first of your income. This body. It is all about order.',
     doorBtn:'Open the decision page',
     done:'Mark this section as done', doneOn:'✓ Done',
     refHead:'Open anytime',
     start:'Start with Part 1',
     openLabel:'Open in the Bible app',
     progress:'done'}
};

let lang='ja';
try{ lang = localStorage.getItem('it_lang') || 'ja'; }catch(e){}
let doneSet = new Set();
try{ doneSet = new Set(JSON.parse(localStorage.getItem('it_done')||'[]')); }catch(e){}
function saveDone(){ try{ localStorage.setItem('it_done', JSON.stringify([...doneSet])); }catch(e){} }

const hasEN = ()=> (typeof CONTENT_IT_EN!=='undefined') && CONTENT_IT_EN && Array.isArray(CONTENT_IT_EN.sections) && CONTENT_IT_EN.sections.length>0;
const C = ()=> (lang==='en' && hasEN()) ? CONTENT_IT_EN : CONTENT_IT_JA;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- inline markdown ---------- */
function inline(s){
  let t = esc(s);
  // links [label](url)
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  // 相互参照【◯◯】→ 該当セクションへのリンク
  const XREF = (lang==='en')
    ? {'Bible Guide':'bible','Put God first':'decide','Names of God':'names',
       'Talk':'h1','Listen':'h2','Read':'h3','Sing':'h4','Taste':'h5','Cut':'h6','Give':'h7','Gather':'h8'}
    : {'聖書ガイド':'bible','神様を一番にしたい人へ':'decide','神の名前':'names',
       '話す':'h1','聞く':'h2','読む':'h3','歌う':'h4','味わう':'h5','断つ':'h6','捧げる':'h7','集う':'h8'};
  t = t.replace(/【([^】]+)】/g, (m0, inner)=>{
    const id = XREF[inner];
    const label = (lang==='en') ? inner : '【'+inner+'】';
    return id ? '<a href="#'+id+'">'+label+'</a>' : (lang==='en' ? '"'+inner+'"' : m0);
  });
  return t;
}
const BIBLE_LINE = /^(?:\*\*)?\[([^\]]+)\]\((https?:\/\/www\.bible\.com[^)]+)\)(?:\*\*)?$/;
const SECLABEL   = /^\*\*(【.+?】)\*\*(.*)$/;

/* ---------- block markdown ---------- */
function renderMd(md){
  const lines = md.split('\n');
  let out='', i=0;
  const flushPara = buf => { if(buf.length) out += '<p>'+buf.map(inline).join('<br>')+'</p>'; };
  let para=[];
  const closePara = ()=>{ flushPara(para); para=[]; };

  while(i < lines.length){
    let L = lines[i];
    const t = L.trim();

    if(t===''){ closePara(); i++; continue; }

    // horizontal rule
    if(/^-{3,}$/.test(t)){ closePara(); if(!/^-{3,}$/.test((lines[i+1]||'').trim())) out+='<hr class="sep">'; i++; continue; }

    // ## / ### headings
    if(/^###\s+/.test(t)){ closePara(); out+='<h3>'+inline(t.replace(/^###\s+/,''))+'</h3>'; i++; continue; }
    if(/^##\s+/.test(t)){ closePara(); out+='<h2>'+inline(t.replace(/^##\s+/,''))+'</h2>'; i++; continue; }

    // 【section label】
    let m = t.match(SECLABEL);
    if(m){
      closePara();
      let lab = m[1];
      if(lang==='en') lab = lab.replace(/[【】]/g,'');
      out+='<div class="seclabel">'+esc(lab)+(m[2]?'<span style="font-weight:400;color:var(--muted);font-size:.85rem">'+esc(m[2])+'</span>':'')+'</div>';
      i++; continue;
    }

    // ⚠️ warning block
    if(t.startsWith('**⚠️')){
      closePara();
      const head = t.replace(/\*\*/g,'');
      let body=[]; i++;
      while(i<lines.length && !/^-{3,}$/.test(lines[i].trim())){ body.push(lines[i]); i++; }
      out+='<div class="warn"><div class="wh">'+esc(head)+'</div>'+renderMd(body.join('\n'))+'</div>';
      continue;
    }

    // bible reference line
    if(BIBLE_LINE.test(t)){
      closePara();
      const g = t.match(BIBLE_LINE);
      out+='<div class="verse"><a href="'+g[2]+'" target="_blank" rel="noopener">📖 '+esc(g[1])+'</a><span class="go">'+esc(UI[lang].openLabel)+' ↗</span></div>';
      i++; continue;
    }

    // blockquote → prayer
    if(t.startsWith('>')){
      closePara();
      let buf=[];
      while(i<lines.length && lines[i].trim().startsWith('>')){ buf.push(lines[i].trim().replace(/^>\s?/,'')); i++; }
      out+='<div class="prayer">'+buf.map(inline).join('<br>')+'</div>';
      continue;
    }

    // table
    if(t.startsWith('|')){
      closePara();
      let rows=[];
      while(i<lines.length && lines[i].trim().startsWith('|')){
        const r = lines[i].trim();
        if(!/^\|[\s\-|:]+\|$/.test(r)){
          rows.push(r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
        }
        i++;
      }
      out+='<table class="mdtable">'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')+'</table>';
      continue;
    }

    // write-in line
    if(/^＿{3,}$/.test(t)){ closePara(); out+='<div class="writeline"></div>'; i++; continue; }

    // ordered list
    if(/^\d+\.\s+/.test(t)){
      closePara();
      let items=[];
      while(i<lines.length && /^\d+\.\s+/.test(lines[i].trim())){ items.push(lines[i].trim().replace(/^\d+\.\s+/,'')); i++; }
      out+='<ol class="nlist">'+items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>';
      continue;
    }

    // bullet list — 「- 」で始まる
    if(/^-\s+/.test(t)){
      closePara();
      let items=[];
      while(i<lines.length && /^-\s+/.test(lines[i].trim())){ items.push(lines[i].trim().replace(/^-\s+/,'')); i++; }
      // 問い（？で終わる）は qlist、それ以外は plist
      const isQ = items.some(x=>/[？?]\s*$/.test(x));
      out+='<ul class="'+(isQ?'qlist':'plist')+'">'+items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>';
      continue;
    }

    para.push(L.trim());
    i++;
  }
  closePara();
  return out;
}

/* ---------- pages ---------- */
function secById(id){ return C().sections.find(s=>s.id===id); }
function ordered(){
  const c=C();
  const main=c.sections.filter(s=>['j','h','f','w'].includes(s.g));
  const refs=c.refs.map(r=>c.sections.find(s=>s.id===r.id)).filter(Boolean);
  return main.concat(refs);
}

function doorCard(){
  const u=UI[lang];
  return `<div class="doorcard"><div class="t">❤️ ${esc(u.door)}</div><p>${esc(u.doorNote)}</p><a class="btn primary" href="#decide">${esc(u.doorBtn)}</a></div>`;
}

function renderHome(){
  const c=C(), u=UI[lang];
  const main = c.sections.filter(s=>['j','h','f','w'].includes(s.g));
  const total = main.length;
  const doneN = main.filter(s=>doneSet.has(s.id)).length;

  let h=`<div class="hero">
    <div class="eyebrow">${esc(c.title)}</div>
    <h1>${esc(c.subtitle)}</h1>
    <div class="heroverse">${inline(c.hero)}</div>
  </div>`;

  h+=`<div class="card"><div class="md" style="font-size:.92rem">${renderMd(c.lead)}</div>
      <div style="text-align:center;margin:1.2rem 0 .2rem"><a class="btn primary" href="#j1">${esc(u.start)}</a></div>
      <p style="text-align:center;font-size:.78rem;color:var(--muted);margin-top:.7rem">${doneN} / ${total} ${esc(u.progress)}</p></div>`;

  h+=`<div class="toc">`;
  for(const g of c.groups){
    const list = c.sections.filter(s=>s.g===g.p);
    h+=`<div class="wkblock"><div class="wkhead"><span class="wkno">${esc(g.label)}</span><h2>${esc(g.title)}</h2></div>
        <div class="wkintro">${inline(g.intro)}</div><ul class="daylist">`;
    for(const s of list){
      h+=`<li><a href="#${s.id}"><span class="dn">${s.n}</span><span class="ttl">${esc(s.t)}${s.s?`<span class="sub">${esc(s.s)}</span>`:''}</span><span class="dot ${doneSet.has(s.id)?'done':''}"></span></a></li>`;
    }
    h+=`</ul></div>`;
  }
  // references
  h+=`<div class="wkblock"><div class="wkhead"><span class="wkno">${esc(c.refLabel||'REF')}</span><h2>${esc(c.refTitle||u.refHead)}</h2></div><ul class="daylist">`;
  for(const r of c.refs){
    h+=`<li><a href="#${r.id}"><span class="dn">·</span><span class="ttl">${esc(r.t)}<span class="sub">${esc(r.s)}</span></span></a></li>`;
  }
  h+=`</ul></div></div>`;

  h+=`<div class="formula">INTIMACY × IDENTITY × MISSION ＝ TOGETHER</div>`;
  h+=doorCard();
  return h;
}

function renderSection(id){
  const c=C(), u=UI[lang], s=secById(id);
  if(!s) return renderHome();
  const seq = ordered();
  const idx = seq.findIndex(x=>x.id===id);
  const grp = c.groups.find(g=>g.p===s.g);

  let h=`<div class="daypg">`;
  h+=`<div class="partlabel">${esc(grp?grp.label:'REF')}${s.n?' · '+s.n:''}</div>`;
  h+=`<h1 class="daytitle">${esc(s.t)}</h1>`;
  if(s.s) h+=`<div class="daysub">${esc(s.s)}</div>`;
  h+=`<div class="md">${renderMd(s.md)}</div>`;

  if(idx>=0){
    if(s.g!=='r') h+=`<button class="donebtn ${doneSet.has(id)?'on':''}" id="donebtn">${doneSet.has(id)?u.doneOn:u.done}</button>`;
    h+=`<div class="pagenav">`;
    h+= idx>0 ? `<a href="#${seq[idx-1].id}">${u.prev}</a>` : `<span></span>`;
    h+=`<a class="home" href="#">${u.home}</a>`;
    h+= idx<seq.length-1 ? `<a href="#${seq[idx+1].id}">${u.next}</a>` : `<span></span>`;
    h+=`</div>`;
  }else{
    h+=`<div class="pagenav"><span></span><a class="home" href="#">${u.home}</a><span></span></div>`;
  }
  h+=`</div>`;
  return h;
}

/* ---------- router ---------- */
function route(){
  const app=document.getElementById('app');
  const id=location.hash.replace(/^#/,'');
  document.body.className = lang==='en'?'en':'';
  document.documentElement.lang = lang;
  document.getElementById('doortext').textContent = UI[lang].door;
  document.getElementById('verNote').textContent = lang==='en'
    ? 'Scripture links: English Standard Version (YouVersion)'
    : '聖句リンク：リビングバイブル（YouVersion）';

  const known = id && (secById(id) || false);
  if(known){
    app.innerHTML=renderSection(id);
    document.getElementById('doorfix').hidden = (id==='decide');
    const b=document.getElementById('donebtn');
    if(b) b.addEventListener('click',()=>{
      if(doneSet.has(id)) doneSet.delete(id); else doneSet.add(id);
      saveDone();
      b.classList.toggle('on',doneSet.has(id));
      b.textContent = doneSet.has(id)?UI[lang].doneOn:UI[lang].done;
    });
  }else{
    app.innerHTML=renderHome();
    document.getElementById('doorfix').hidden=true;
  }
  window.scrollTo(0,0);
  document.getElementById('btnja').classList.toggle('on',lang==='ja');
  document.getElementById('btnen').classList.toggle('on',lang==='en');
}
function setLang(l){
  if(l==='en' && !hasEN()){ return; }
  lang=l; try{localStorage.setItem('it_lang',l);}catch(e){} route();
}
document.getElementById('btnja').addEventListener('click',()=>setLang('ja'));
document.getElementById('btnen').addEventListener('click',()=>setLang('en'));
window.addEventListener('hashchange',route);
if(!hasEN()){ document.getElementById('btnen').style.display='none'; }
if(lang==='en' && !hasEN()){ lang='ja'; }
route();
</script>
